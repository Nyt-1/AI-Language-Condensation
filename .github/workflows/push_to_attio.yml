name: 5. Push to Attio

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  push-to-attio:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' || github.event.issue.title == '5. Push to Attio'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Coda → Attio
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          CODA_DOC_ID: ${{ secrets.CODA_DOC_ID }}
          CODA_TABLE_ID: ${{ secrets.CODA_TABLE_ID }}
          CODA_TIMELINE_TABLE_ID: ${{ secrets.CODA_TIMELINE_ID }}
          DEST_CHANNEL_ID: ${{ secrets.DEST_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAM_MEMBERS: ${{ secrets.TEAM_MEMBERS }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
        run: python .github/scripts/Push_to_Attio.py
