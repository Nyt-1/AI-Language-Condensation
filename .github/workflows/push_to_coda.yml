name: 3. Push Raw to CODA

on:
  workflow_run:
    workflows: ["2. Raw Digest"]
    types:
      - completed
  workflow_dispatch:

jobs:
  push-to-coda:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Slack → Coda
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DEST_CHANNEL_ID: ${{ secrets.DEST_CHANNEL_ID }}
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          CODA_DOC_ID: ${{ secrets.CODA_DOC_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAM_MEMBERS: ${{ secrets.TEAM_MEMBERS }}
          CODA_TABLE_ID: ${{ secrets.CODA_TABLE_ID }}
          CODA_TIMELINE_TABLE_ID: ${{ secrets.CODA_TIMELINE_ID }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL }}
        run: python .github/scripts/Push_to_CODA.py
